[tool.ruff]
line-length = 120
target-version = "py312"
exclude = ["notebooks", "cache", "data"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501", # line length handled by formatter, not a hard error
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
